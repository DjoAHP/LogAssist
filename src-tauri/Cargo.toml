[package]
name = "logassist"
version = "3.3.1"
description = "LogAssist — assistant IA pour apprendre des logiciels"
authors = ["DjoAHP"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "logassist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
argon2 = { version = "0.5", features = ["std", "rand"] }
http = "1.5"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# keyring v4 : les features natives activent chaque backend séparément
# (windows-native-keyring-store / apple-native / zbus). V1 Windows-only →
# on ne sélectionne que le backend Windows ; default-features = false possible
# plus tard (v3) pour réduire le binaire si caution/mock devient inutile.
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }
futures = "0.3.34"
sse-stream = "0.2.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[dev-dependencies]
# Serveur Streamable HTTP factice pour les tests d'intégration du transport MCP.
axum = "0.8"
rmcp = { version = "3.8.0", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

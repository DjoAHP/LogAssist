[package]
name = "logassist"
version = "2.1.2"
description = "LogAssist — assistant IA pour apprendre des logiciels"
authors = ["DjoAHP"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "logassist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# keyring v4 : les features natives activent chaque backend séparément
# (windows-native-keyring-store / apple-native / zbus). V1 Windows-only →
# on ne sélectionne que le backend Windows ; default-features = false possible
# plus tard (v3) pour réduire le binaire si caution/mock devient inutile.
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

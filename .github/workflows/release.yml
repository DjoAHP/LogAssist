# Publication d'une release LogAssist : édition bureau signée pour l'updater
# et exécutable portable avec empreinte SHA-256 sur la même Release GitHub.
# Déclencheur : tag v* (git tag vX.Y.Z + push).
# La clé privée minisign vit exclusivement dans les Secrets GitHub.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build + signature + publication
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installation des dépendances (npm ci)
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Vérifie l'alignement tag / version de l'app
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($tag -ne $conf.version) {
            throw "Tag v$tag différent de la version de l'app $($conf.version) — lancez npm run sync:version avant de taguer."
          }
      - name: Charge les notes de release versionnées
        id: release_notes
        env:
          LOGASSIST_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/load-release-notes.mjs
      - name: Build de l'édition portable
        run: npm run tauri build -- --features portable --config src-tauri/tauri.portable.conf.json
      - name: Prépare l'artefact portable et son empreinte SHA-256
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/LogAssistPortable.exe"
          $directory = "release-artifacts/portable"
          if (-not (Test-Path $source)) {
            throw "Exécutable portable introuvable : $source"
          }
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item $source "$directory/LogAssistPortable.exe" -Force
          $hash = (Get-FileHash "$directory/LogAssistPortable.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LogAssistPortable.exe" | Set-Content "$directory/LogAssistPortable.exe.sha256" -Encoding ascii
      - name: Build, signature et publication de la Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
      - name: Ajoute l'édition portable à la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "release-artifacts/portable/LogAssistPortable.exe" `
            "release-artifacts/portable/LogAssistPortable.exe.sha256" `
            --clobber
